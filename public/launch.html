<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Picker — Launch</title>
<link rel="stylesheet" href="launch.css">
<main>
  <h1>Start a session</h1>
  <p id="status" role="status">Connecting to the wrangler…</p>
  <section id="pick" hidden>
    <dl>
      <dt>Page</dt><dd id="p-url"></dd>
      <dt>Element</dt><dd id="p-el"></dd>
      <dt>JSX site</dt><dd id="p-jsx"></dd>
      <dt>Rendered by</dt><dd><ol id="p-owners"></ol></dd>
    </dl>
  </section>
  <form id="form" hidden>
    <fieldset>
      <legend>Action</legend>
      <label><input type="radio" name="action" value="fix" checked> Fix</label>
      <label><input type="radio" name="action" value="reusable"> Make reusable</label>
    </fieldset>
    <label for="note">Note</label>
    <textarea id="note" rows="5" maxlength="4096" required placeholder="What's wrong, or what you want"></textarea>
    <div id="paste" tabindex="0">Paste a screenshot (⌘V) — optional</div>
    <div class="buttons">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" id="launch" disabled>Launch</button>
    </div>
  </form>
</main>
<script type="module" src="launch.js"></script>
